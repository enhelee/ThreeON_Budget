# 사내 서버(최종 목표) 구성 — 반입한 이미지 + 영속 볼륨 + (선택) PostgreSQL
#   절차와 스크립트: docs/사내이관_가이드.md · deploy/onprem/
#   사내 서버:      deploy/onprem/load_and_run.{sh,ps1} <tar.gz> [--pg]   ← docker load 후 up -d --no-build
#   인터넷 PC 직접: docker compose -f deploy/docker-compose.yml up -d --build  (빌드 가능한 곳에서만)
# 비밀값은 전부 .env(.env.example 복사, 이 파일의 부모 폴더)에서 읽는다. .env는 Git에 올리지 않는다.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: threeon-budget:latest
    # 오프라인 서버가 이미지를 못 찾으면 레지스트리를 뒤지며 시간을 끈다 — 바로 실패하게.
    pull_policy: never
    container_name: threeon-budget
    env_file:
      - ../.env
    environment:
      PORT: "8080"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"     # 사내 http라면 0, https 프록시 뒤라면 1
      APP_REV: "${APP_REV:-onprem}"            # 메인 헤더에 찍히는 리비전 라벨
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - budget_data:/data/budget       # budget.db(SQLite 모드)·output
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: ["pg"]
    image: postgres:16-alpine
    container_name: threeon-postgres
    environment:
      POSTGRES_DB: "${PG_DB:-budget}"
      POSTGRES_USER: "${PG_USER:-budget}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:?PG_PASSWORD를 .env에 설정하세요}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-budget} -d ${PG_DB:-budget}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  budget_data:
  pg_data:
