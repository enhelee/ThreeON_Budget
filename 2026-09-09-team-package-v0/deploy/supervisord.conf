[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:budget_app]
command=python -m uvicorn server:app --host 127.0.0.1 --port 8010 --app-dir /srv/budget_app --proxy-headers --forwarded-allow-ips="*"
directory=/srv/budget_app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:forecast_app]
; v2 앱은 CSV·모델을 현재 작업 폴더에 쓴다 → 볼륨(/data/forecast)에서 실행, 코드는 /srv/forecast_app
command=python -m streamlit run /srv/forecast_app/app.py --server.address=127.0.0.1 --server.port=8501 --server.baseUrlPath=forecast --server.headless=true --browser.gatherUsageStats=false
directory=%(ENV_FORECAST_DATA_DIR)s
environment=PYTHONPATH="/srv/forecast_app"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=caddy run --config /srv/deploy/Caddyfile --adapter caddyfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
