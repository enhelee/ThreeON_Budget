    <!-- 발표 오프닝 입체 ON 로고(2026-10-31 grace): O 의 오른쪽이 N 의 왼쪽 기둥 — 한 덩어리.
         앞면은 O·N 이 같은 색(진한 빨강 → 이음매에서 샴페인 금빛)을 나눠 쓰고, 그 위에 크롬처럼 경계가 딱 끊기는 반사 띠를 얹어 금속 느낌을 낸다 -->
