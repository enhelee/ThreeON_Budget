# Render Blueprint — 무료 공개 배포(지금 단계). 저장소 루트에 이 파일이 있으면 Render가 자동 인식한다.
#   1) GitHub 저장소를 Render에 연결 → "New Blueprint" → 이 파일 선택
#   2) 대시보드에서 APP_PASSWORD, DATABASE_URL(Supabase) 값을 직접 입력(sync: false = Git에 값 없음)
#   3) 배포 후 https://<서비스이름>.onrender.com/ — 주소는 이것 하나다(옥 /app/ 은 301 로 루트로 보낸다)
# 무료 플랜 제약: 15분 미사용 시 슬립(첫 접속 30~60초 지연), 디스크 비영속(재배포 시 초기화) → DB는 Supabase.
services:
  - type: web
    name: threeon-budget
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./2026-09-09-team-package-v0/deploy/Dockerfile
    dockerContext: ./2026-09-09-team-package-v0
    healthCheckPath: /healthz
    autoDeploy: true            # ⚠ 실제로는 걸리지 않는다(2026-09 반복 실측) — 병합 뒤 대시보드에서 Manual Deploy
    envVars:
      - key: APP_PASSWORD
        sync: false                 # 대시보드에서 입력 — 팀 공용 비밀번호
      - key: SECRET_KEY
        generateValue: true         # Render가 무작위 생성(세션 서명)
      - key: DATABASE_URL
        sync: false                 # Supabase 연결 문자열(Session pooler, port 5432 — 상주 컨테이너용)
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_REV
        value: rev20                # 메인 헤더에 찍히는 리비전 라벨(사람이 읽는 값) — CHANGELOG 의 rev 와 맞춘다
      - key: SESSION_HOURS
        value: "12"
      - key: PORT
        value: "8080"
