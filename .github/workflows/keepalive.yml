# Supabase 무료 프로젝트 일시정지 방지 — 이틀마다 운영 앱의 /healthz?db=1 을 부른다.
# Supabase 무료 플랜은 7일 동안 DB 활동이 없으면 프로젝트를 일시정지한다(배포가이드 §1.1).
# 기본 /healthz 는 DB 를 안 건드리므로 ?db=1(SELECT 1 한 번)이어야 활동으로 남는다.
# Render 무료 서버는 15분 미사용 시 잠들어 첫 응답이 30~60초 걸린다 → 넉넉한 시간 제한 + 재시도.
# 비밀값 없음: 공개 주소만 부른다. 주소를 바꾸려면 저장소 Variables 에 APP_URL 을 넣는다.
# ⚠ GitHub 은 60일 동안 커밋이 없는 저장소의 예약 실행을 멈춘다(메일 안내) — 그때는 Actions 탭에서 다시 켠다.
name: keepalive

on:
  schedule:
    - cron: "17 0 */2 * *"      # 이틀마다 09:17 KST(00:17 UTC). 정각은 GitHub 대기열이 몰려 늦어진다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DB 한 번 읽기 (/healthz?db=1)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://threeon-budget.onrender.com' }}
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
               "$APP_URL/healthz?db=1"
          echo
