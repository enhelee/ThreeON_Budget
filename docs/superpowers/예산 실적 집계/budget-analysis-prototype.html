<body>
  <div class="min-h-screen lg:flex">
    <div id="backdrop" class="fixed inset-0 z-30 hidden bg-slate-950/30 lg:hidden" aria-hidden="true"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-slate-200 bg-white px-4 py-5 transition-transform duration-200 lg:sticky lg:top-0 lg:h-screen lg:translate-x-0">
      <div class="flex items-center gap-3 px-2">
        <div class="grid h-11 w-11 place-items-center rounded-2xl bg-blue-600 text-white shadow-sm" aria-hidden="true">

        <div>

        <p class="px-3 pb-1 pt-5 text-xs font-semibold uppercase tracking-wider text-slate-400">업무 단계</p>
        <button class="nav-button" data-view="budget"><span class="grid h-7 w-7 place-items-center rounded-lg bg-slate-100 text-xs text-slate-600">1</span>예산 계획</button>
        <button class="nav-button" data-view="collect"><span class="grid h-7 w-7 place-items-center rounded-lg bg-slate-100 text-xs text-slate-600">2</span>실적 집계</button>
        <button class="nav-button" data-view="branches"><span class="grid h-7 w-7 place-items-center rounded-lg bg-slate-100 text-xs text-slate-600">3</span>실적 분석</button>
        <button class="nav-button" data-view="standard"><span class="grid h-7 w-7 place-items-center rounded-lg bg-slate-100 text-xs text-slate-600">4</span>예산 표준화</button>
        <button class="nav-button" data-view="forecast"><span class="grid h-7 w-7 place-items-center rounded-lg bg-slate-100 text-xs text-slate-600">5</span>중장기 예측</button>
        <p class="px-3 pb-1 pt-5 text-xs font-semibold uppercase tracking-wider text-slate-400">관리</p>
        <button class="nav-button" data-view="settings"><span class="grid h-7 w-7 place-items-center rounded-lg bg-slate-100 text-xs text-slate-600">S</span>설정</button>
      </nav>

      <div class="rounded-2xl bg-blue-50 p-4">
        <div class="flex items-center gap-2 text-sm font-semibold text-blue-900">
          <span class="h-2 w-2 rounded-full bg-emerald-500"></span>사내망 · 로컬 저장
        </div>
        <p class="mt-2 text-xs leading-5 text-blue-700">불러온 자료는 외부로 전송하지 않고 이 브라우저에만 보관합니다.</p>
      </div>
    </aside>

    <div class="min-w-0 flex-1">
      <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="flex min-h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
          <div class="flex min-w-0 items-center gap-3">
            <button id="menuButton" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 text-slate-600 lg:hidden" aria-label="메뉴 열기">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="min-w-0">
              <h1 id="pageTitle" class="truncate text-lg font-bold text-slate-950">홈</h1>
              <p id="pageSubtitle" class="hidden truncate text-xs text-slate-500 sm:block">최근 3개년 예산과 실적을 확인합니다.</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span id="dataStatus" class="hidden rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-700 sm:inline-flex">예시 데이터</span>
            <button class="btn-primary" data-action="import">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 15v4h14v-4"/></svg>
              <span class="hidden sm:inline">CSV 불러오기</span><span class="sm:hidden">불러오기</span>
            </button>
          </div>
        </div>
      </header>

      <main id="page" class="mx-auto max-w-7xl p-4 sm:p-6 lg:p-8" aria-live="polite"></main>
    </div>
  </div>

  <input id="csvInput" class="hidden" type="file" accept=".csv,text/csv">
  <div id="toast" class="pointer-events-none fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-2xl bg-slate-950 px-4 py-3 text-sm font-medium text-white shadow-xl" role="status"></div>

  <script>
    const STORAGE_KEY = "budget-analysis-prototype-records-v1";
    const IMPORTED_KEY = "budget-analysis-prototype-imported-v1";

    function makeRecord(year, branch, plan, actual, ratio = 0.62) {
      const profitPlan = Math.round(plan * ratio);
      const profitActual = Math.round(actual * ratio);
      return {
        year,
        branch,
        profitPlan,
        profitActual,
        capitalPlan: plan - profitPlan,
        capitalActual: actual - profitActual
      };
    }

    const SAMPLE_TOTALS = {
      2024: [["북부지사",160,151],["남부지사",190,180],["서부지사",150,142],["중앙지사",145,136],["중부지사",170,159],["동부지사",130,120],["해안지사",125,116],["산단지사",110,101]],
      2025: [["북부지사",170,163],["남부지사",205,194],["서부지사",160,151],["중앙지사",155,146],["중부지사",180,169],["동부지사",140,128],["해안지사",130,120],["산단지사",120,105]],
      2026: [["북부지사",180,174],["남부지사",220,205],["서부지사",170,157],["중앙지사",165,150],["중부지사",190,170],["동부지사",150,127],["해안지사",140,112],["산단지사",125,104]]
    };

    const SAMPLE_RECORDS = Object.entries(SAMPLE_TOTALS).flatMap(([year, rows]) =>
      rows.map(([branch, plan, actual]) => makeRecord(Number(year), branch, plan, actual))
    );

    const state = {
      view: "home",
      year: null,
      type: "all",
      range: 3,
      sort: "rateDesc",
      search: "",
      inflation: 2.5,
      aging: 1.5
    };

    let records = loadRecords();
    state.year = latestYear();

    const viewMeta = {
      home: ["홈", "최근 3개년 예산과 실적을 확인합니다."],
      budget: ["예산 계획", "지사 계획을 등록하고 표준예산과 비교합니다."],
      collect: ["실적 집계", "실적 업로드부터 사업 매칭 검토까지 진행합니다."],
      branches: ["전체 지사 현황", "입력된 모든 지사의 계획·실적·집행률을 조회합니다."],
      standard: ["예산 표준화", "과년도 실적을 조합별 벤치마크로 만듭니다."],
      forecast: ["중장기 예측", "표준금액에 팩터를 적용해 미래 예산을 살펴봅니다."],
      settings: ["설정", "데이터와 지사·부서 매핑 기준을 관리합니다."]
    };

    function loadRecords() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return structuredClone(SAMPLE_RECORDS);
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) && parsed.length ? parsed : structuredClone(SAMPLE_RECORDS);
      } catch {
        return structuredClone(SAMPLE_RECORDS);
      }
    }

    function latestYear() {
      return records.length ? Math.max(...records.map(r => Number(r.year))) : new Date().getFullYear();
    }

    function years() {
      return [...new Set(records.map(r => Number(r.year)))].sort((a, b) => b - a);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[char]));
    }

    function num(value) {
      const parsed = Number(String(value ?? "").replaceAll(",", "").trim());
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function amounts(row, type = state.type) {
      if (type === "profit") return { plan: num(row.profitPlan), actual: num(row.profitActual) };
      if (type === "capital") return { plan: num(row.capitalPlan), actual: num(row.capitalActual) };
      return {
        plan: num(row.profitPlan) + num(row.capitalPlan),
        actual: num(row.profitActual) + num(row.capitalActual)
      };
    }

    function rate(plan, actual) {
      return plan > 0 ? actual / plan * 100 : null;
    }

    function aggregate(rows, type = state.type) {
      return rows.reduce((acc, row) => {
        const value = amounts(row, type);
        acc.plan += value.plan;
        acc.actual += value.actual;
        return acc;
      }, { plan: 0, actual: 0 });
    }

    function yearly(year, type = state.type) {
      return aggregate(records.filter(r => Number(r.year) === Number(year)), type);
    }

    function branchesForYear(year, type = state.type) {
      const map = new Map();
      records.filter(r => Number(r.year) === Number(year)).forEach(row => {
        const key = String(row.branch).trim();
        const value = amounts(row, type);
        const current = map.get(key) || { branch: key, plan: 0, actual: 0 };
        current.plan += value.plan;
        current.actual += value.actual;
        map.set(key, current);
      });
      return [...map.values()].map(row => ({...row, balance: row.plan - row.actual, rate: rate(row.plan, row.actual)}));
    }

    function formatAmount(value) {
      return `${Math.round(value).toLocaleString("ko-KR")}억`;
    }

    function formatRate(value) {
      return value === null ? "-" : `${value.toFixed(1)}%`;
    }

    function formatDelta(value) {
      if (!Number.isFinite(value)) return "비교 데이터 없음";
      const sign = value > 0 ? "+" : "";
      return `전년 대비 ${sign}${value.toFixed(1)}%p`;
    }

    function rateBadge(value) {
      if (value === null) return '<span class="badge bg-slate-100 text-slate-600">계산 불가</span>';
      if (value >= 95) return `<span class="badge bg-blue-50 text-blue-700">${formatRate(value)}</span>`;
      if (value >= 85) return `<span class="badge bg-emerald-50 text-emerald-700">${formatRate(value)}</span>`;
      return `<span class="badge bg-amber-50 text-amber-700">${formatRate(value)}</span>`;
    }

    function yearOptions() {
      return years().map(year => `<option value="${year}" ${year === Number(state.year) ? "selected" : ""}>${year}년</option>`).join("");
    }

    function filters({includeRange = false, includeSort = false, includeSearch = false} = {}) {
      return `
        <div class="flex flex-wrap items-end gap-3">
          ${includeSearch ? `<label class="block min-w-48 flex-1"><span class="mb-1.5 block text-xs font-semibold text-slate-500">지사명 검색</span><input class="control w-full" data-filter="search" value="${escapeHtml(state.search)}" placeholder="지사명을 입력하세요"></label>` : ""}
          ${includeRange ? `<label class="block"><span class="mb-1.5 block text-xs font-semibold text-slate-500">조회 범위</span><select class="control" data-filter="range"><option value="3" ${state.range === 3 ? "selected" : ""}>최근 3개년</option><option value="5" ${state.range === 5 ? "selected" : ""}>최근 5개년</option></select></label>` : ""}
          <label class="block"><span class="mb-1.5 block text-xs font-semibold text-slate-500">기준연도</span><select class="control" data-filter="year">${yearOptions()}</select></label>
          <label class="block"><span class="mb-1.5 block text-xs font-semibold text-slate-500">예산 구분</span><select class="control" data-filter="type"><option value="all" ${state.type === "all" ? "selected" : ""}>전체</option><option value="profit" ${state.type === "profit" ? "selected" : ""}>손익</option><option value="capital" ${state.type === "capital" ? "selected" : ""}>자본</option></select></label>
          ${includeSort ? `<label class="block"><span class="mb-1.5 block text-xs font-semibold text-slate-500">정렬</span><select class="control" data-filter="sort"><option value="rateDesc" ${state.sort === "rateDesc" ? "selected" : ""}>집행률 높은 순</option><option value="rateAsc" ${state.sort === "rateAsc" ? "selected" : ""}>집행률 낮은 순</option><option value="planDesc" ${state.sort === "planDesc" ? "selected" : ""}>예산 금액 큰 순</option><option value="branchAsc" ${state.sort === "branchAsc" ? "selected" : ""}>지사명 순</option></select></label>` : ""}
        </div>`;
    }

    function emptyState(message) {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-6 py-10 text-center"><p class="font-semibold text-slate-700">${escapeHtml(message)}</p><button class="btn-primary mt-4" data-action="import">CSV 불러오기</button></div>`;
    }

    function renderHome() {
      const current = yearly(state.year);
      const previous = yearly(Number(state.year) - 1);
      const currentRate = rate(current.plan, current.actual);
      const previousRate = rate(previous.plan, previous.actual);
      const delta = currentRate !== null && previousRate !== null ? currentRate - previousRate : NaN;
      const availableYears = years().filter(year => year <= Number(state.year)).slice(0, state.range).reverse();
      const chartRows = availableYears.map(year => ({year, ...yearly(year)}));
      const maxPlan = Math.max(1, ...chartRows.map(row => row.plan));
      const topFive = branchesForYear(state.year).sort((a, b) => (b.rate ?? -Infinity) - (a.rate ?? -Infinity)).slice(0, 5);

      return `
        <div class="space-y-6">

      return `
        <div class="space-y-6"><section><p class="text-sm font-semibold text-blue-700">운영 관리</p><h2 class="mt-1 text-2xl font-bold tracking-tight text-slate-950">데이터와 표시 기준</h2><p class="mt-2 text-sm text-slate-500">지사명은 불러온 데이터에서 자동으로 반영됩니다.</p></section>
        <section class="grid gap-4 sm:grid-cols-3"><article class="metric-card"><p class="text-sm font-semibold text-slate-500">저장 연도</p><p class="mt-3 text-2xl font-bold">${years().length}개년</p></article><article class="metric-card"><p class="text-sm font-semibold text-slate-500">등록 지사</p><p class="mt-3 text-2xl font-bold">${uniqueBranches}개</p></article><article class="metric-card"><p class="text-sm font-semibold text-slate-500">데이터 행</p><p class="mt-3 text-2xl font-bold">${records.length.toLocaleString("ko-KR")}건</p></article></section>
        <section class="panel p-6"><div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between"><div><h3 class="section-title">CSV 데이터 관리</h3><p class="section-help">새 파일을 불러오면 지사명과 연도별 금액이 교체됩니다.</p></div><div class="flex flex-wrap gap-2"><button class="btn-primary" data-action="import">CSV 불러오기</button><button class="btn-secondary" data-action="reset">예시 데이터 복원</button></div></div><div class="mt-6 rounded-xl bg-slate-50 p-4"><p class="text-sm font-semibold text-slate-700">필수 컬럼</p><code class="mt-2 block overflow-x-auto text-xs text-slate-600">연도,지사명,손익계획,손익실적,자본계획,자본실적</code></div></section>
        <section class="panel p-6"><h3 class="section-title">실제 Streamlit 연결 항목</h3><div class="mt-5 grid gap-3 sm:grid-cols-2"><div class="rounded-xl border border-slate-200 p-4"><p class="font-semibold">지사·부서 매핑</p><p class="mt-1 text-sm text-slate-500">표시명과 적용 시작연도 관리</p></div><div class="rounded-xl border border-slate-200 p-4"><p class="font-semibold">분류 모델 관리</p><p class="mt-1 text-sm text-slate-500">재학습·초기화·버전 확인</p></div></div></section></div>`;
    }

    function renderPage() {
      const renderers = {home: renderHome, budget: renderBudget, collect: renderCollect, branches: renderBranches, standard: renderStandard, forecast: renderForecast, settings: renderSettings};
      document.getElementById("page").innerHTML = renderers[state.view]();
      const [title, subtitle] = viewMeta[state.view];
      document.getElementById("pageTitle").textContent = title;
      document.getElementById("pageSubtitle").textContent = subtitle;
      document.querySelectorAll("[data-view]").forEach(button => {
        if (!button.closest("nav")) return;
        button.classList.toggle("nav-button-active", button.dataset.view === state.view);
      });
      document.getElementById("dataStatus").textContent = localStorage.getItem(IMPORTED_KEY) === "true" ? "내 데이터 사용 중" : "예시 데이터";
    }

    function navigate(view) {
      if (!viewMeta[view]) return;
      state.view = view;
      state.search = "";
      renderPage();
      closeMenu();
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function openMenu() {
      document.getElementById("sidebar").classList.remove("-translate-x-full");
      document.getElementById("backdrop").classList.remove("hidden");
    }

    function closeMenu() {
      if (window.innerWidth >= 1024) return;
      document.getElementById("sidebar").classList.add("-translate-x-full");
      document.getElementById("backdrop").classList.add("hidden");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.add("hidden"), 3200);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", quoted = false;
      const source = text.replace(/^\uFEFF/, "");
      for (let i = 0; i < source.length; i++) {
        const char = source[i];
        if (char === '"') {
          if (quoted && source[i + 1] === '"') { cell += '"'; i++; }
          else quoted = !quoted;
        } else if (char === "," && !quoted) { row.push(cell.trim()); cell = ""; }
        else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && source[i + 1] === "\n") i++;
          row.push(cell.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = []; cell = "";
        } else cell += char;
      }
      row.push(cell.trim());
      if (row.some(value => value !== "")) rows.push(row);
      return rows;
    }

    function importCsv(text) {
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error("데이터 행이 없습니다.");
      const headers = rows[0];
      const required = ["연도","지사명","손익계획","손익실적","자본계획","자본실적"];
      const indexes = Object.fromEntries(required.map(key => [key, headers.indexOf(key)]));
      const missing = required.filter(key => indexes[key] < 0);
      if (missing.length) throw new Error(`필수 컬럼이 없습니다: ${missing.join(", ")}`);
      const next = rows.slice(1).map((row, index) => ({
        year: Math.trunc(num(row[indexes["연도"]])),
        branch: String(row[indexes["지사명"]] || "").trim(),
        profitPlan: num(row[indexes["손익계획"]]),
        profitActual: num(row[indexes["손익실적"]]),
        capitalPlan: num(row[indexes["자본계획"]]),
        capitalActual: num(row[indexes["자본실적"]])
      })).filter(row => row.year > 0 && row.branch);
      if (!next.length) throw new Error("유효한 연도와 지사명이 없습니다.");
      records = next;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      localStorage.setItem(IMPORTED_KEY, "true");
      state.year = latestYear();
      state.view = "home";
      renderPage();
      showToast(`${records.length}개 데이터 행을 불러왔습니다.`);
    }

    function exportCsv() {
      const rows = visibleBranchRows();
      const lines = [["연도","지사명","계획","실적","잔액","집행률"], ...rows.map(row => [state.year,row.branch,row.plan,row.actual,row.balance,row.rate === null ? "" : row.rate.toFixed(1)])];
      const csv = "\uFEFF" + lines.map(row => row.map(value => `"${String(value).replaceAll('"','""')}"`).join(",")).join("\r\n");
      const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `전체지사현황_${state.year}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("현재 조회 결과를 내려받았습니다.");
    }

    document.addEventListener("click", event => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) { navigate(viewButton.dataset.view); return; }
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "import") document.getElementById("csvInput").click();
      if (action === "export") exportCsv();
      if (action === "reset") {
        records = structuredClone(SAMPLE_RECORDS);
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(IMPORTED_KEY);
        state.year = latestYear();
        renderPage();
        showToast("예시 데이터를 복원했습니다.");
      }
    });

    document.addEventListener("change", event => {
      const filter = event.target.dataset.filter;
      if (filter === "year") state.year = Number(event.target.value);
      if (filter === "type") state.type = event.target.value;
      if (filter === "range") state.range = Number(event.target.value);
      if (filter === "sort") state.sort = event.target.value;
      if (filter) renderPage();
      const forecast = event.target.dataset.forecast;
      if (forecast) { state[forecast] = Number(event.target.value); renderPage(); }
    });

    document.addEventListener("input", event => {
      if (event.target.dataset.filter !== "search") return;
      state.search = event.target.value;
      const cursor = event.target.selectionStart;
      renderPage();
      const next = document.querySelector('[data-filter="search"]');
      if (next) { next.focus(); next.setSelectionRange(cursor, cursor); }
    });

    document.getElementById("csvInput").addEventListener("change", async event => {
      const file = event.target.files?.[0];
      if (!file) return;
      try { importCsv(await file.text()); }
      catch (error) { showToast(error.message || "CSV를 불러오지 못했습니다."); }
      event.target.value = "";
    });

    document.getElementById("menuButton").addEventListener("click", openMenu);
    document.getElementById("backdrop").addEventListener("click", closeMenu);
    window.addEventListener("resize", () => { if (window.innerWidth >= 1024) document.getElementById("backdrop").classList.add("hidden"); });

    renderPage();
  </script>
</body>
</html>
